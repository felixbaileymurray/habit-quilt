name: iOS

on:
  pull_request:
    branches: [dev]

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + unit tests
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Pick iOS Simulator destination
        id: dest
        run: |
          DEST=$(python3 <<'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"], text=True
          )
          data = json.loads(raw)
          preferred = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if not d.get("isAvailable"):
                      continue
                  name = d.get("name", "")
                  if name.startswith("iPhone"):
                      preferred.append((name, d["udid"]))
          if not preferred:
              sys.exit("No available iPhone simulator")
          # Prefer higher numbered iPhones when names sort that way
          preferred.sort(key=lambda x: x[0], reverse=True)
          name, udid = preferred[0]
          print(f"platform=iOS Simulator,id={udid}", end="")
          print(f"Selected {name} ({udid})", file=sys.stderr)
          PY
          )
          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          echo "Using $DEST"

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project HabitQuilt.xcodeproj \
            -scheme HabitQuilt

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project HabitQuilt.xcodeproj \
            -scheme HabitQuilt \
            -destination "${{ steps.dest.outputs.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit tests (logic only — no UI tests)
        run: |
          set -o pipefail
          xcodebuild \
            -project HabitQuilt.xcodeproj \
            -scheme HabitQuilt \
            -destination "${{ steps.dest.outputs.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:HabitQuiltTests \
            test

      - name: Draft copy report (informational)
        if: always()
        run: |
          echo "## draft( copy placeholders"
          if command -v rg >/dev/null 2>&1; then
            rg -n 'draft\(' HabitQuilt Packages || true
          else
            grep -RIn 'draft(' HabitQuilt Packages || true
          fi
          echo "(Informational only — human writes final copy.)"
